# Deploy static content (index.html) from branch dev-Nurlybek to GitHub Pages
name: Deploy index.html to Pages

on:
  push:
    branches: ["dev-Nurlybek"]   # <- your branch here
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only index.html
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./index.html   # <- only deploying this file

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
