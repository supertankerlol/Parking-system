version: "3.8"
services:
  cv:
    build: .
    image: smartparking-cv:latest
    container_name: smartparking_cv
    volumes:
      - ./snapshots:/data/snapshots
      - ./parking_positions.json:/app/parking_positions.json:ro
      - ./config.yml:/app/config.yml:ro
      - ./test_videos:/app/test_videos:ro
    environment:
      - SHOW_WINDOW=0
    # пример: если backend поднят в той же сети:
    depends_on:
      - backend
  backend:
    image: your-backend-image
    environment:
      - DATABASE_URL=...
    ports:
      - "8000:8000"
