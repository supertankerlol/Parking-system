<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Book Parking Spot</title>
    
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/payment.css">
</head>
<body class="app-layout">

    <aside id="sidebar-placeholder"></aside>

    <main class="main-content">
        <header id="header-placeholder"></header>

        <div class="page-content">
            <div class="payment-container">
                <section class="payment-summary">
                    <h2 class="payment-title">Booking Details</h2>
                    <div class="summary-card">
                        <div class="summary-line">
                            <span>Parking Lot:</span>
                            <span id="booking-lot-name">Loading...</span>
                        </div>
                        <div class="summary-line">
                            <span>Address:</span>
                            <span id="booking-address">Loading...</span>
                        </div>
                        <div class="summary-line">
                            <span>Spot ID:</span>
                            <span id="booking-spot-id">Loading...</span>
                        </div>
                        <div class="summary-line">
                            <span>Hourly Rate:</span>
                            <span id="booking-hourly-rate">Loading...</span>
                        </div>
                        <div id="booking-day-rate-container" class="summary-line" style="display: none;">
                            <span>Day Rate:</span>
                            <span id="booking-day-rate">--</span>
                        </div>
                        <div id="booking-early-bird-container" class="summary-line" style="display: none;">
                            <span>Early Bird Rate:</span>
                            <span id="booking-early-bird">--</span>
                        </div>
                    </div>
                </section>

                <section class="payment-form-container">
                    <h2 class="payment-title">Select Time</h2>
                    
                    <form id="booking-form" class="payment-form">
                        <div class="form-group">
                            <label for="start-time" class="form-label">Start Time</label>
                            <input 
                                type="datetime-local" 
                                id="start-time" 
                                name="startTime" 
                                class="form-control" 
                                required
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="end-time" class="form-label">End Time</label>
                            <input 
                                type="datetime-local" 
                                id="end-time" 
                                name="endTime" 
                                class="form-control" 
                                required
                            >
                        </div>

                        <div class="summary-card" style="margin-top: 1.5rem;">
                            <h3 class="summary-title" style="margin-top: 0;">Booking Summary</h3>
                            <div class="summary-line">
                                <span>Duration:</span>
                                <span id="summary-duration">--</span>
                            </div>
                            <div class="summary-line">
                                <span>Rate:</span>
                                <span id="summary-rate">--</span>
                            </div>
                            <div class="summary-line summary-total">
                                <span>Total Cost:</span>
                                <span id="summary-total">$0.00</span>
                            </div>
                        </div>
                        
                        <p id="booking-error" class="form-error" aria-live="assertive"></p>
                        
                        <button type="submit" id="confirm-booking-btn" class="btn btn-primary btn-full-width">
                            Confirm Booking
                        </button>
                    </form>
                </section>
            </div>
        </div>

        <footer id="footer-placeholder"></footer>
    </main>

    <!-- Core scripts in dependency order -->
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/user-store.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/booking.js" defer></script>
</body>
</html>
