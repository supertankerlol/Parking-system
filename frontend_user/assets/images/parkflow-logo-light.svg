<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Map pin icon with parking spot -->
  <g id="icon">
    <!-- Map pin base -->
    <path d="M 20 10 C 20 5 24 2 30 2 C 36 2 40 5 40 10 C 40 15 30 25 30 25 C 30 25 20 15 20 10 Z" 
          fill="#1e40af" stroke="#1e40af" stroke-width="1"/>
    <!-- Parking spot inside pin -->
    <rect x="24" y="8" width="12" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 26 10 L 26 18 M 26 10 L 30 10 Q 32 10 32 12 Q 32 14 30 14 L 26 14" 
          fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Location dot -->
    <circle cx="30" cy="20" r="2" fill="#ffffff"/>
  </g>
  <!-- Flow lines from pin -->
  <path d="M 45 20 Q 50 15 55 20" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M 45 20 Q 50 25 55 20" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <circle cx="55" cy="20" r="2.5" fill="#10b981"/>
  <!-- Text -->
  <text x="65" y="38" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="24" font-weight="600" fill="#1f2937">ParkFlow</text>
</svg>
