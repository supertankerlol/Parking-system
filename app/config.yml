# config.yml
camera:
  id: "cam-1"
  # rtsp_url or path to test video file
  source: "rtsp://username:pass@192.168.1.10:554/stream"
  # For local testing, use: source: "./test_videos/parking_test.mp4"
backend:
  events_endpoint: "http://backend:8000/api/cv/events"
  # если нет backend во время теста, можно указать null и события не отправлять
  send_events: true
storage:
  snapshots_dir: "/data/snapshots"  # в контейнере /mnt/data/snapshots или /data
yolo:
  model: "yolov8n.pt"  # yolov8n (nano) — быстрый и легковесный для MVP; можно заменить на yolov8s.pt
detection:
  class_filter: [2, 5, 7]  # COCO classes: 2=car,5=bus,7=truck (по желанию)
  conf_threshold: 0.35
  iou_threshold: 0.5
debounce:
  frames_window: 5       # сколько последних кадров хранить
  confirm_count: 3       # сколько кадров подряд должны быть occupied чтобы подтвердить
  release_count: 3       # сколько кадров подряд свободных чтобы подтвердить освобождение
logging:
  level: INFO
